<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Clerk portal retired - VHS Admin</title>
  <link rel="icon" type="image/png" href="../web-page/image/vhs-assets/vhs-logo.png">
  <link rel="stylesheet" href="../shared/dashboard-theme.css?v=3.4.6">
  <style>
    /* Minimal landing styles only; the Admin portal is the real product. */
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f6f4fb; margin: 0; }
    .top-navbar { background: #3d2b63; color: #fff; display: flex; align-items: center; gap: 0.6rem; padding: 0.7rem 1.2rem; }
    .top-navbar img { height: 28px; }
    .brand-name { font-weight: 700; }
    .brand-subtitle { opacity: 0.75; font-size: 0.85rem; }
    .navbar-datetime { margin-left: auto; font-size: 0.85rem; opacity: 0.9; }
    main { max-width: 620px; margin: 3.5rem auto; padding: 0 1.25rem; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 1rem; padding: 1.75rem; }
    h1 { font-size: 1.15rem; margin: 0 0 0.5rem; color: #1f2937; }
    p { color: #6b7280; font-size: 0.92rem; margin: 0.35rem 0; }
    .note { font-size: 0.8rem; color: #9ca3af; margin-top: 1rem; }
  </style>
</head>
<body>
  <nav class="top-navbar">
    <img src="../web-page/image/vhs-assets/vhs-logo.png" alt="VHS Logo" class="navbar-logo">
    <span class="brand-name">VHS</span>
    <span class="brand-subtitle">Animal Wellness Center</span>
    <div class="navbar-datetime" id="navbarDatetime"></div>
  </nav>
  <main>
    <div class="card">
      <h1>The Clerk portal has been retired</h1>
      <p>VHS now runs three roles only: User, Doctor, and Admin.</p>
      <p>The front-desk tools you are looking for live in the Admin portal.</p>
      <p id="msg">Taking you to the Admin portal&hellip;</p>
      <p class="note">If you are not redirected, <a id="go" href="../admin/appointments.html">open the Admin portal</a>.</p>
    </div>
  </main>
  <script>
    (function () {
      var t = '../admin/appointments.html';
      var a = document.getElementById('go');
      if (a) a.setAttribute('href', t);
      setTimeout(function () { window.location.replace(t); }, 800);
    })();
// Standard Admin navbar clock (visual parity while the redirect lingers).
(function(){
  var el = document.getElementById('navbarDatetime');
  if (!el) return;
  var M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var D = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  function upd(){
    var n = new Date();
    var s = D[n.getDay()] + ', ' + M[n.getMonth()] + ' ' + n.getDate() + ', ' + n.getFullYear();
    var h = n.getHours(); var m = n.getMinutes(); var sec = n.getSeconds();
    var ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
    var t = h + ':' + (m < 10 ? '0' : '') + m + ':' + (sec < 10 ? '0' : '') + sec + ' ' + ap;
    el.innerHTML = '<span class="dt-date">' + s + '</span><span class="dt-sep">|</span><span class="dt-time">' + t + '</span>';
  }
  upd(); setInterval(upd, 1000);
})();
  </script>
</body>
</html>
