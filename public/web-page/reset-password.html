<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reset password | VHS Animal Wellness Center</title><link rel="stylesheet" href="reset-password.css"></head><body><main><h1>Reset your password</h1><p>Enter your account email to request a verification code. Then enter the code and your new password below.</p><p id="message" role="status" aria-live="polite"></p><form id="request"><label>Email <input type="email" name="email" maxlength="254" autocomplete="email" required></label><button>Send verification code</button></form><form id="confirm"><label>Email <input type="email" name="email" maxlength="254" autocomplete="email" required></label><label>Six-digit code <input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required></label><label>New password <input type="password" name="password" minlength="8" maxlength="72" autocomplete="new-password" required></label><label>Confirm new password <input type="password" name="password_confirmation" minlength="8" maxlength="72" autocomplete="new-password" required></label><button>Reset password</button></form><a href="/auth">Return to login</a></main><script src="reset-password.js"></script></body></html>
