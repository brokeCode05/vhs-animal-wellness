<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=web-page/index.html">
  <title>VHS Animal Wellness Center</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #1a0a3e;
      color: white;
    }
    .wrap { text-align: center; }
    .paws { display: flex; gap: 0.5rem; justify-content: center; margin-bottom: 2rem; align-items: flex-end; }
    .paw { opacity: 0; animation: pawIn 0.4s ease-out forwards; }
    .paw:nth-child(1) { animation-delay: 0s; }
    .paw:nth-child(2) { animation-delay: 0.25s; }
    .paw:nth-child(3) { animation-delay: 0.5s; }
    .paw:nth-child(4) { animation-delay: 0.75s; }
    .paw svg { width: 32px; height: 32px; }
    .paw:nth-child(1) svg { fill: rgba(255,255,255,0.2); }
    .paw:nth-child(2) svg { fill: rgba(255,255,255,0.35); }
    .paw:nth-child(3) svg { fill: rgba(255,255,255,0.5); }
    .paw:nth-child(4) svg { fill: #ffaa00; }
    @keyframes pawIn {
      from { opacity: 0; transform: translateY(6px) scale(0.7); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .title { font-size: 1rem; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; }
    .sub   { font-size: 0.75rem; color: rgba(255,255,255,0.35); margin-top: 0.4rem; }
    .link  { display: inline-block; margin-top: 1.5rem; color: #ffaa00; text-decoration: none; font-size: 0.8rem; }
  </style>
</head>
<body>
  <div class="wrap">

      <div class="paw"><svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><ellipse cx="22" cy="18" rx="8" ry="10"/><ellipse cx="42" cy="18" rx="8" ry="10"/><ellipse cx="10" cy="34" rx="7" ry="9"/><ellipse cx="54" cy="34" rx="7" ry="9"/><path d="M32 36c-10 0-18 7-18 14s4 10 10 10c4 0 6-2 8-6 2 4 4 6 8 6 6 0 10-5 10-10s-8-14-18-14z"/></svg></div>

</html>
